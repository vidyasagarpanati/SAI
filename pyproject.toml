[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archery-biomechanics"
version = "0.1.0"
description = "Deterministic archery biomechanics analysis pipeline. Python measures, the model only writes prose."
requires-python = ">=3.11,<3.13"

[project.scripts]
archery = "archery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
