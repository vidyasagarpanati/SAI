# Deterministic shot and phase segmentation (S4).
#
# Every key here is read by src/archery/steps/s04_phases.py. Nothing in this file
# is decorative. Distances are in shoulder widths (landmark 11 to 12) so they do
# not depend on camera distance. Editing this file re-runs S4 onward only; pose
# estimation stays cached.
#
# Tuning procedure: run to S4, open runs/<run_id>/04_phases.json, read
# "signal_summary" (percentiles of every driving signal on YOUR footage), and set
# thresholds from those numbers. Do not tune by eye.

version: 3

shot_detection:
  anchor_distance_enter: 0.45     # draw wrist to mouth-corner midpoint, below this = anchored
  anchor_distance_exit: 0.70      # hysteresis: must exceed this to leave the anchored state
  min_anchor_hold_s: 0.20         # anchored runs shorter than this are noise, not shots
  max_nan_gap_s: 0.10             # anchored state survives landmark dropouts up to this long
  release_search_before_s: 0.10   # release = draw-wrist speed peak within this window
  release_search_after_s: 0.15    #   around the end of the anchored run
  release_velocity_z: 3.0         # peak above mean + z*SD -> HIGH confidence, else MEDIUM

phases:
  pre_draw:
    bow_arm_rise_fraction: 0.15   # setup starts when bow-arm elevation passes this fraction
                                  # of the way from rest to its level at draw start
    min_rise_shoulder_widths: 0.30  # smaller total rise -> setup not detectable
  draw:
    min_decrease_rate_per_s: 0.15 # anchor distance must shrink at least this fast
  anchor:
    stability_window_s: 0.10      # anchor phase lasts until the anchor distance settles
    stability_tolerance: 0.03     # rolling SD below this = settled
  expansion:
    min_elbow_rate_deg_per_s: 2.0 # sustained draw-elbow angle change before release
    min_duration_s: 0.05
    max_duration_s: 1.50
  release:
    window_before_s: 0.02
    window_after_s: 0.05
  follow_through:
    duration_after_release_s: 0.60
  recovery:
    bow_arm_drop_fraction: 0.15   # recovery ends when bow arm falls back below this fraction
    max_duration_s: 1.50

# The SHOT, as timed for comparison: from hooking and gripping (USA Archery /
# KiSik Lee National Training System step 3) to the arrow release (step 12).
# The pose model sees wrists, not fingers, so hook-and-grip is read as the draw
# hand resting at the string beside the bow hand, both still, shortly before
# the bow arm rises. When that is not seen, the shot starts at setup (the bow
# arm starting to rise) and is marked LOW confidence. Tune hook_max_hand_gap
# from signal_summary.hand_gap_norm on your own footage.
shot_cycle:
  hook_max_hand_gap: 1.0          # shoulder widths between draw wrist and bow wrist
  hook_max_hand_speed: 0.5        # both wrists slower than this (shoulder widths/s)
  hook_min_hold_s: 0.30           # hands together at least this long
  hook_max_lead_s: 8.0            # hook-and-grip must end within this long before setup

boundary_confidence:
  hysteresis_frames: 3            # tolerated noisy frames when walking a boundary, and the
                                  # window inspected when grading a boundary's confidence
  min_key_frame_visible_landmarks: 20
